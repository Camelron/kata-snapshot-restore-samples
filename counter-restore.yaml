apiVersion: v1
kind: Pod
metadata:
  labels:
    run: counter
  annotations:
    io.katacontainers.restore-from: "/run/vc/vm/snapshots/counter"
  name: counter-kata-restored
spec:
  containers:
  - image: mcr.microsoft.com/azurelinux/base/python:3.12
    imagePullPolicy: Never
    name: counter
    # this command cannot serve HTTP: a restored Pod that answers on 9999
    # with yaml=source is proof of restore rather than a cold start
    command: ["sleep", "infinity"]
    ports:
    - containerPort: 9999
  runtimeClassName: kata-preview
