apiVersion: v1
kind: Pod
metadata:
  labels:
    run: openclaw
  annotations:
    io.katacontainers.restore-from: "/run/vc/vm/snapshots/openclaw"
  name: openclaw-kata-restored
spec:
  containers:
  - image: ghcr.io/openclaw/openclaw:2026.3.28
    imagePullPolicy: Never
    name: openclaw
    # this command cannot start the gateway: a restored Pod that serves the
    # Control UI on 18789 is proof of restore rather than a cold start
    command: ["sleep", "infinity"]
    ports:
    - containerPort: 18789
    volumeMounts:
    - mountPath: /home/node/.openclaw
      name: openclaw-state
    - mountPath: /etc/openclaw
      name: openclaw-config
  volumes:
  - name: openclaw-state
    emptyDir: {}
  - name: openclaw-config
    configMap:
      name: openclaw-config
  runtimeClassName: kata-preview
