apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: busybox-kata
spec:
  selector:
    matchLabels:
      app: busybox-kata-source
  template:
    metadata:
      labels:
        app: busybox-kata-source
        run: busybox
    spec:
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
      containers:
      - image: docker.io/library/busybox:latest
        name: busybox
      runtimeClassName: kata-preview
